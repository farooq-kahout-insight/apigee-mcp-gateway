[project]
name = "agent-airlock-mcp"
version = "0.1.0"
description = "MCP server whose only route to any backend is the Apigee gateway"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

# A single-module stdio server, not a distributable library: tell uv to manage
# the dependencies without trying to build a wheel out of the directory.
[tool.uv]
package = false
